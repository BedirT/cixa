<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Cixa request path, storage boundary, and architectural decisions</title>
  <desc id="desc">A numbered technical architecture diagram. The owner configures policy and a volatile payment session. An untrusted agent uses a networkless MCP bridge, scoped capability file, and Unix socket to reach the broker. The broker authenticates, evaluates policy, durably reserves an intent, and only then allows an isolated browser to submit to an approved merchant once. KOHO results are reconciled manually. Separate owner and agent volumes enforce which data each identity can read.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f8fc"/><stop offset="0.55" stop-color="#fbfcfd"/><stop offset="1" stop-color="#fbf5e9"/></linearGradient>
    <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17364b"/><stop offset="1" stop-color="#101d2c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183349" flood-opacity="0.12"/></filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#397e9e"/></marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b98532"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3e8d6b"/></marker>
    <style>
      .sans { font-family: Inter, Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Newsreader, Georgia, serif; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 1.7px; }
      .lane { font-size: 13px; font-weight: 750; letter-spacing: 1.2px; }
      .heading { font-size: 18px; font-weight: 730; fill: #26394d; }
      .body { font-size: 12px; fill: #627487; }
      .small { font-size: 11px; fill: #6d7d8d; }
      .white-heading { font-size: 18px; font-weight: 730; fill: #f8fbfd; }
      .white-body { font-size: 12px; fill: #becbd5; }
      .flow { fill: none; stroke: #397e9e; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#blueArrow); }
      .money { fill: none; stroke: #b98532; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#goldArrow); }
      .result { fill: none; stroke: #3e8d6b; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#greenArrow); }
      .number { font-size: 12px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="1600" height="1120" rx="34" fill="url(#background)"/>
  <g class="sans">
    <rect x="52" y="38" width="215" height="30" rx="15" fill="#fff" fill-opacity="0.8" stroke="#dbeaf2"/><circle cx="73" cy="53" r="5" fill="#397e9e"/><text x="87" y="57" class="eyebrow" fill="#51697c">TECHNICAL OVERVIEW</text>
    <text x="52" y="112" class="serif" font-size="42" font-weight="600" fill="#203246">Request path and trust boundaries</text>
    <text x="52" y="143" font-size="15" fill="#637487">What crosses each boundary, what stays private, and where a purchase can stop.</text>
    <text x="52" y="202" class="lane" fill="#9a6d25">OWNER CONTROL</text><text x="52" y="348" class="lane" fill="#397e9e">AGENT REQUEST</text><text x="52" y="577" class="lane" fill="#3e8d6b">RESULT</text>

    <rect x="180" y="170" width="1370" height="112" rx="24" fill="#fff" fill-opacity="0.64" stroke="#e0c796"/>
    <g filter="url(#shadow)"><rect x="210" y="193" width="240" height="66" rx="17" fill="#fff"/><text x="232" y="219" class="heading">Owner console</text><text x="232" y="241" class="body">Loopback UI · owner authentication</text></g>
    <path d="M450 226H520" class="money"/><rect x="520" y="193" width="270" height="66" rx="17" fill="#fffaf0" stroke="#ead7b2"/><text x="542" y="219" class="heading">Policy and authority</text><text x="542" y="241" class="body">Modes · budgets · merchants · consent</text>
    <path d="M790 226H860" class="money"/><rect x="860" y="193" width="286" height="66" rx="17" fill="#fffaf0" stroke="#ead7b2"/><text x="882" y="219" class="heading">Capability provisioning</text><text x="882" y="241" class="body">Scoped file · expiry · revocation · one agent</text>
    <rect x="1190" y="193" width="322" height="66" rx="17" fill="#fffaf0" stroke="#ead7b2"/><text x="1212" y="219" class="heading">Volatile payment session</text><text x="1212" y="241" class="body">Owner armed · time and operation bounded</text>

    <rect x="180" y="315" width="440" height="224" rx="26" fill="#eaf5fa" fill-opacity="0.82" stroke="#7dbbd7" stroke-dasharray="7 7"/><text x="203" y="344" class="eyebrow" fill="#397e9e">UNTRUSTED IDENTITY · UID 10001</text>
    <rect x="646" y="315" width="644" height="224" rx="26" fill="url(#trusted)" filter="url(#shadow)"/><text x="669" y="344" class="eyebrow" fill="#d8b363">TRUSTED OWNER IDENTITY · UID 10000</text>
    <rect x="1316" y="315" width="234" height="224" rx="26" fill="#fff9ed" stroke="#d8b363"/><text x="1339" y="344" class="eyebrow" fill="#9a6d25">EXTERNAL</text>

    <g filter="url(#shadow)"><rect x="205" y="370" width="174" height="116" rx="20" fill="#fff"/><text x="226" y="401" class="heading">Agent</text><text x="226" y="425" class="body">Researches and shops</text><text x="226" y="445" class="body">Collects final facts</text><rect x="226" y="458" width="130" height="18" rx="9" fill="#eef6fa"/><text x="291" y="471" class="small" text-anchor="middle">skill is guidance only</text></g>
    <g filter="url(#shadow)"><rect x="420" y="370" width="174" height="116" rx="20" fill="#fff"/><text x="441" y="401" class="heading">MCP bridge</text><text x="441" y="425" class="body">Agent-safe tools only</text><text x="441" y="445" class="body">No network or owner API</text><text x="441" y="467" class="small">read-only IPC mount</text></g>
    <rect x="670" y="370" width="174" height="116" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.16"/><text x="691" y="401" class="white-heading">Broker</text><text x="691" y="425" class="white-body">Peer + capability auth</text><text x="691" y="445" class="white-body">Strict bounded schema</text><text x="691" y="467" class="white-body">Agent-scoped response</text>
    <rect x="868" y="370" width="190" height="116" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.16"/><text x="889" y="401" class="white-heading">Policy + ledger</text><text x="889" y="425" class="white-body">Checks every fixed limit</text><text x="889" y="445" class="white-body">Reserves before submit</text><text x="889" y="467" class="white-body">Persists state + audit</text>
    <rect x="1082" y="370" width="184" height="116" rx="20" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.16"/><text x="1103" y="401" class="white-heading">Checkout</text><text x="1103" y="425" class="white-body">One-use secret grant</text><text x="1103" y="445" class="white-body">Isolated Playwright</text><text x="1103" y="467" class="white-body">Recheck + submit once</text>
    <g filter="url(#shadow)"><rect x="1340" y="370" width="186" height="116" rx="20" fill="#fff"/><text x="1361" y="401" class="heading">Merchant</text><text x="1361" y="425" class="body">Approved HTTPS origin</text><text x="1361" y="445" class="body">Pinned hosted fields</text><text x="1361" y="467" class="body">Still untrusted input</text></g>

    <path d="M379 428H420" class="flow"/><circle cx="399" cy="408" r="12" fill="#397e9e"/><text x="399" y="408" class="number">1</text>
    <path d="M594 428H670" class="flow"/><circle cx="632" cy="408" r="12" fill="#397e9e"/><text x="632" y="408" class="number">2</text>
    <path d="M844 428H868" class="flow"/><circle cx="856" cy="408" r="12" fill="#397e9e"/><text x="856" y="408" class="number">3</text>
    <path d="M1058 428H1082" class="flow"/><circle cx="1070" cy="408" r="12" fill="#397e9e"/><text x="1070" y="408" class="number">4</text>
    <path d="M1266 428H1340" class="money"/><circle cx="1303" cy="408" r="12" fill="#b98532"/><text x="1303" y="408" class="number">5</text>
    <rect x="579" y="495" width="319" height="27" rx="13" fill="#edf7fb" stroke="#b7d8e7"/><text x="738" y="513" class="small" text-anchor="middle">Unix socket + scoped token file · IPC group 12000</text>

    <rect x="180" y="558" width="1370" height="146" rx="24" fill="#fff" fill-opacity="0.66" stroke="#abd4c2"/>
    <rect x="210" y="587" width="250" height="88" rx="18" fill="#eef8f3" stroke="#abd4c2"/><text x="232" y="617" class="heading">Intent result</text><text x="232" y="641" class="body">settled · declined · failed</text><text x="232" y="661" class="body">unknown · reconciliation required</text>
    <path d="M460 631H620" class="result"/><circle cx="540" cy="611" r="12" fill="#3e8d6b"/><text x="540" y="611" class="number">6</text>
    <rect x="620" y="587" width="300" height="88" rx="18" fill="#eef8f3" stroke="#abd4c2"/><text x="642" y="617" class="heading">Durable ledger state</text><text x="642" y="641" class="body">A timeout after submit is ambiguous.</text><text x="642" y="661" class="body">Read state, tell the owner, never retry.</text>
    <path d="M920 631H1080" class="result"/><circle cx="1000" cy="611" r="12" fill="#3e8d6b"/><text x="1000" y="611" class="number">7</text>
    <rect x="1080" y="587" width="220" height="88" rx="18" fill="#fff9ed" stroke="#e0c796"/><text x="1102" y="617" class="heading">KOHO app</text><text x="1102" y="641" class="body">Owner checks provider truth</text><text x="1102" y="661" class="body">No API and no scraping</text>
    <path d="M1300 631H1450" class="money"/><circle cx="1375" cy="611" r="12" fill="#b98532"/><text x="1375" y="611" class="number">8</text>
    <rect x="1450" y="587" width="70" height="88" rx="18" fill="#fff9ed" stroke="#e0c796"/><text x="1485" y="622" class="heading" text-anchor="middle">Owner</text><text x="1485" y="646" class="small" text-anchor="middle">reconciles</text>

    <text x="52" y="764" class="eyebrow" fill="#51697c">PERSISTENT STORAGE ACCESS</text>
    <rect x="52" y="785" width="452" height="105" rx="22" fill="#eaf5fa" stroke="#8fc3da"/><text x="76" y="817" class="heading">Agent IPC volume · read-only to MCP</text><text x="76" y="842" class="body">Contains: cixa.sock and scoped capability files</text><text x="76" y="866" class="body">Does not contain: owner socket, policy state, audit key, profiles, or card</text>
    <rect x="528" y="785" width="638" height="105" rx="22" fill="url(#trusted)"/><text x="552" y="817" class="white-heading">Owner data volume · never mounted into the agent</text><text x="552" y="842" class="white-body">Authenticated state · owner and dashboard credentials · audit material · merchant profiles</text><text x="552" y="866" class="white-body">Helper identity · reconciliation history · owner socket · no persisted PAN, expiry, or CVV</text>
    <rect x="1190" y="785" width="358" height="105" rx="22" fill="#fff9ed" stroke="#e0c796"/><text x="1214" y="817" class="heading">Card data · memory only</text><text x="1214" y="842" class="body">Piped into an owner-armed helper</text><text x="1214" y="866" class="body">Expires by time or checkout count</text>

    <text x="52" y="949" class="eyebrow" fill="#51697c">WHY THE SYSTEM IS SHAPED THIS WAY</text>
    <rect x="52" y="970" width="238" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="72" y="999" class="heading">OS isolation</text><text x="72" y="1023" class="body">Different UIDs and volumes enforce</text><text x="72" y="1043" class="body">what guidance cannot.</text>
    <rect x="310" y="970" width="238" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="330" y="999" class="heading">No broker TCP port</text><text x="330" y="1023" class="body">ACLs, peer identity, and capability</text><text x="330" y="1043" class="body">auth gate local IPC.</text>
    <rect x="568" y="970" width="238" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="588" y="999" class="heading">Persist first</text><text x="588" y="1023" class="body">Reservation and execution state are</text><text x="588" y="1043" class="body">durable before payment submission.</text>
    <rect x="826" y="970" width="238" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="846" y="999" class="heading">Profile, not guessing</text><text x="846" y="1023" class="body">Origins, hosted fields, selectors, and</text><text x="846" y="1043" class="body">visible facts are owner reviewed.</text>
    <rect x="1084" y="970" width="238" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="1104" y="999" class="heading">Secrets stay volatile</text><text x="1104" y="1023" class="body">The card is never state, a prompt,</text><text x="1104" y="1043" class="body">an MCP result, or a browser trace.</text>
    <rect x="1342" y="970" width="206" height="104" rx="20" fill="#fff" stroke="#dce8ef"/><text x="1362" y="999" class="heading">Unknown stops</text><text x="1362" y="1023" class="body">Ambiguous payment requires</text><text x="1362" y="1043" class="body">owner reconciliation, not retry.</text>
  </g>
</svg>

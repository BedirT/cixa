<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Cixa Docker-first security architecture</title>
  <desc id="desc">An untrusted agent reaches the Cixa broker through an MCP bridge, scoped token, and Unix socket. The owner side keeps policy, ledger, card session, and controlled browser private. Approved merchants receive card input, while KOHO remains an owner-only source for reconciliation.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7fc"/>
      <stop offset="0.52" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f8f1e5"/>
    </linearGradient>
    <linearGradient id="owner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17354a"/>
      <stop offset="1" stop-color="#101b2b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#eaf5fb" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8ead1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#20384d" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#07131f" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#397e9e"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c18b35"/>
    </marker>
    <style>
      .sans { font-family: Inter, Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Newsreader, Georgia, serif; }
      .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 2px; }
      .zone-title { font-size: 24px; font-weight: 720; fill: #26394d; }
      .card-title { font-size: 18px; font-weight: 720; fill: #26394d; }
      .body { font-size: 13px; fill: #637487; }
      .tiny { font-size: 11px; font-weight: 650; letter-spacing: .5px; }
      .owner-title { font-size: 19px; font-weight: 720; fill: #f8fbfd; }
      .owner-body { font-size: 12px; fill: #bdcbd7; }
      .flow { fill: none; stroke: #397e9e; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrowBlue); }
      .flow-gold { fill: none; stroke: #c18b35; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrowGold); }
    </style>
  </defs>

  <rect width="1400" height="860" rx="36" fill="url(#page)"/>
  <circle cx="175" cy="45" r="260" fill="#8dd1ee" opacity="0.13"/>
  <circle cx="1260" cy="780" r="310" fill="#e5b96f" opacity="0.12"/>

  <g class="sans">
    <rect x="55" y="38" width="191" height="30" rx="15" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff"/>
    <circle cx="75" cy="53" r="5" fill="#3b8cb1"/>
    <text x="89" y="57" class="eyebrow" fill="#51697c">DOCKER FIRST</text>
    <text x="55" y="115" class="serif" font-size="45" font-weight="600" fill="#203246">A narrow bridge to real money.</text>
    <text x="55" y="146" font-size="16" fill="#637487">The agent gets tools and a capability. The owner side keeps everything that can move or reveal money.</text>

    <!-- Agent zone -->
    <rect x="55" y="190" width="330" height="570" rx="30" fill="#ffffff" fill-opacity="0.42" stroke="#7dbbd7" stroke-width="1.5" stroke-dasharray="7 8"/>
    <text x="82" y="230" class="eyebrow" fill="#397e9e">UNTRUSTED SIDE</text>
    <text x="82" y="262" class="zone-title">Agent container</text>
    <text x="82" y="285" class="body">UID 10001 · no network in the MCP bridge</text>

    <g filter="url(#shadow)">
      <rect x="82" y="318" width="276" height="116" rx="22" fill="url(#blueCard)" stroke="#ffffff"/>
      <circle cx="112" cy="348" r="15" fill="#dceef7"/>
      <path d="M105 349h14M112 342v14" stroke="#397e9e" stroke-width="2" stroke-linecap="round"/>
      <text x="139" y="353" class="card-title">Codex, Claude, or agent</text>
      <text x="104" y="386" class="body">Shops, reads the final checkout facts,</text>
      <text x="104" y="407" class="body">and asks Cixa to authorize one intent.</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="82" y="464" width="276" height="112" rx="22" fill="url(#blueCard)" stroke="#ffffff"/>
      <rect x="102" y="485" width="34" height="34" rx="10" fill="#dceef7"/>
      <path d="M111 496h16M111 502h11M111 508h14" stroke="#397e9e" stroke-width="2" stroke-linecap="round"/>
      <text x="151" y="505" class="card-title">Cixa MCP bridge</text>
      <text x="102" y="541" class="body">Only agent-safe tools. No owner methods.</text>
      <text x="102" y="560" class="body">No card, browser, state, or KOHO login.</text>
    </g>

    <rect x="82" y="610" width="276" height="94" rx="20" fill="#1f3547"/>
    <text x="104" y="638" class="tiny" fill="#8ec9e3">THE ONLY SHARED VOLUME</text>
    <text x="104" y="666" font-size="14" font-weight="700" fill="#f8fbfd">Unix socket + scoped token</text>
    <text x="104" y="687" class="owner-body">0640/0660 · IPC group 12000</text>

    <!-- Owner zone -->
    <rect x="430" y="190" width="590" height="570" rx="34" fill="url(#owner)" filter="url(#shadow)"/>
    <rect x="450" y="210" width="550" height="530" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M474 233h8v-8h9v8h8v-8h9v27l-17 12-17-12z" fill="#e2bb6c"/>
    <path d="M481 242l10 7 10-7" fill="none" stroke="#17354a" stroke-width="3" stroke-linecap="round"/>
    <text x="524" y="241" class="eyebrow" fill="#d8b363">TRUSTED OWNER SIDE</text>
    <text x="524" y="271" class="serif" font-size="31" font-weight="600" fill="#ffffff">Cixa fortress</text>
    <text x="474" y="298" class="owner-body">UID 10000 · private state volume · read-only container filesystem</text>

    <g filter="url(#softShadow)">
      <rect x="474" y="328" width="238" height="133" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="500" cy="355" r="12" fill="#5ba0bd"/>
      <path d="M494 355h12M500 349v12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="522" y="361" class="owner-title">Broker</text>
      <text x="494" y="394" class="owner-body">Authenticates the capability.</text>
      <text x="494" y="415" class="owner-body">Evaluates limits and consent.</text>
      <text x="494" y="436" class="owner-body">Persists before one submit.</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="738" y="328" width="238" height="133" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="764" cy="355" r="12" fill="#d5ad60"/>
      <path d="M759 355l4 4 7-9" fill="none" stroke="#172739" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="786" y="361" class="owner-title">Policy + ledger</text>
      <text x="758" y="394" class="owner-body">Budgets, merchant rules, sessions.</text>
      <text x="758" y="415" class="owner-body">Tamper-evident audit chain.</text>
      <text x="758" y="436" class="owner-body">Unknown means never retry.</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="474" y="489" width="238" height="131" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="500" cy="516" r="12" fill="#d5ad60"/>
      <path d="M496 514v-4a4 4 0 018 0v4M495 514h10v9h-10z" fill="none" stroke="#172739" stroke-width="1.8"/>
      <text x="522" y="522" class="owner-title">Card session</text>
      <text x="494" y="555" class="owner-body">Owner armed and short lived.</text>
      <text x="494" y="576" class="owner-body">Card exists in helper memory only.</text>
      <text x="494" y="597" class="owner-body">Time and checkout count bounded.</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="738" y="489" width="238" height="131" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="764" cy="516" r="12" fill="#5ba0bd"/>
      <rect x="758" y="511" width="12" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/>
      <text x="786" y="522" class="owner-title">Checkout browser</text>
      <text x="758" y="555" class="owner-body">Fresh Playwright context.</text>
      <text x="758" y="576" class="owner-body">Owner-approved merchant profile.</text>
      <text x="758" y="597" class="owner-body">Rechecks facts, submits once.</text>
    </g>

    <rect x="474" y="651" width="502" height="61" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="501" cy="681" r="11" fill="#4a9a76"/>
    <path d="M496 681l4 4 7-8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="522" y="677" class="owner-title">Owner console</text>
    <text x="522" y="697" class="owner-body">Loopback only · approvals · emergency stop · reconciliation</text>

    <!-- Money edge -->
    <rect x="1065" y="190" width="280" height="570" rx="30" fill="#ffffff" fill-opacity="0.42" stroke="#d8b363" stroke-width="1.5"/>
    <text x="1092" y="230" class="eyebrow" fill="#a87324">MONEY EDGE</text>
    <text x="1092" y="262" class="zone-title">Outside Cixa</text>
    <text x="1092" y="285" class="body">Merchants and issuer stay untrusted</text>

    <g filter="url(#shadow)">
      <rect x="1092" y="328" width="226" height="137" rx="22" fill="url(#goldCard)" stroke="#ffffff"/>
      <circle cx="1120" cy="356" r="14" fill="#efd9af"/>
      <path d="M1112 354h16v11h-16zM1115 354v-5h10v5" fill="none" stroke="#a87324" stroke-width="1.8"/>
      <text x="1145" y="361" class="card-title">Approved merchant</text>
      <text x="1113" y="397" class="body">Exact HTTPS redirect chain.</text>
      <text x="1113" y="418" class="body">Cross-origin hosted fields.</text>
      <text x="1113" y="439" class="body">No CAPTCHA or owner login.</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1092" y="497" width="226" height="137" rx="22" fill="url(#goldCard)" stroke="#ffffff"/>
      <circle cx="1120" cy="525" r="14" fill="#efd9af"/>
      <rect x="1113" y="518" width="14" height="14" rx="3" fill="none" stroke="#a87324" stroke-width="1.8"/>
      <path d="M1117 525h6" stroke="#a87324" stroke-width="1.8" stroke-linecap="round"/>
      <text x="1145" y="530" class="card-title">KOHO app</text>
      <text x="1113" y="566" class="body">Owner checks transactions.</text>
      <text x="1113" y="587" class="body">Settles or declines in Cixa.</text>
      <text x="1113" y="608" class="body">No API and no account scraping.</text>
    </g>

    <rect x="1092" y="666" width="226" height="46" rx="15" fill="#fff" fill-opacity="0.7"/>
    <text x="1112" y="685" class="tiny" fill="#a87324">RECEIVING</text>
    <text x="1112" y="702" font-size="12" fill="#637487">Public address, owner verifies arrival</text>

    <!-- Flows -->
    <path d="M358 520 C 396 520, 397 394, 474 394" class="flow"/>
    <rect x="375" y="441" width="94" height="28" rx="14" fill="#edf7fb" stroke="#b7d8e7"/>
    <text x="422" y="460" text-anchor="middle" class="tiny" fill="#397e9e">INTENT</text>

    <path d="M976 555 C 1025 555, 1027 397, 1092 397" class="flow-gold"/>
    <rect x="981" y="448" width="104" height="28" rx="14" fill="#fff8ec" stroke="#ead3a8"/>
    <text x="1033" y="467" text-anchor="middle" class="tiny" fill="#a87324">SUBMIT ONCE</text>

    <path d="M1092 565 C 1042 565, 1034 681, 976 681" class="flow-gold"/>
    <rect x="986" y="606" width="116" height="28" rx="14" fill="#fff8ec" stroke="#ead3a8"/>
    <text x="1044" y="625" text-anchor="middle" class="tiny" fill="#a87324">RECONCILE</text>

    <text x="55" y="813" class="tiny" fill="#397e9e">BLUE</text>
    <text x="92" y="813" class="body">agent request path</text>
    <circle cx="230" cy="808" r="4" fill="#c18b35"/>
    <text x="245" y="813" class="tiny" fill="#a87324">GOLD</text>
    <text x="290" y="813" class="body">money and reconciliation path</text>
    <text x="1345" y="813" text-anchor="end" class="body">No credential crosses into the agent container.</text>
  </g>
</svg>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-treasury-sdk"
version = "0.1.0"
description = "Thin provider-neutral Python client for a local agent-treasury broker"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]


[workspace]
members = ["crates/domain", "apps/daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/BedirT/cha-ching"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["serde", "clock"] }
fs2 = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
idna = "1.1.0"
libc = "0.2.177"
rand = "0.9.2"
regex = "1.11.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
url = "2.5.7"
wait-timeout = "0.2.1"
zeroize = "1.8.2"
